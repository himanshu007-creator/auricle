name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-bindgen (must match the crate version) and binaryen
        run: |
          cargo install wasm-bindgen-cli --version 0.2.129 --locked
          curl -sL https://github.com/WebAssembly/binaryen/releases/download/version_123/binaryen-version_123-x86_64-linux.tar.gz | tar xz
          echo "$PWD/binaryen-version_123/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo test --workspace --release --all-features
      - run: ./scripts/build-wasm.sh
      - run: npm ci
      - run: npm test -w web
      - run: npm run build -w web
      - run: npm test -w react
      - run: npm run build -w react
