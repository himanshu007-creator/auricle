[package]
name = "auricle-vad"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Voice activity detection as a hand-written Rust forward pass, no inference runtime: Auricle v1 (foreground-selective, 83k parameters) and, behind a feature, Silero VAD v6"
readme = "README.md"

[features]
# Each detector's weights are compiled in with include_bytes!, so a build that
# only needs one model leaves the other out of the binary.
default = ["auricle"]
silero = []
auricle = []

